<svg xmlns="http://www.w3.org/2000/svg" width="140" height="264" viewBox="0 0 140 264">
<!-- The professionals (lot 7): the teacher, the firefighter, the police officer, the doctor, the coach and the office clerk, on the
     grown-ups' 140x264 canvas (adult.svg). Their face and expressions are the children's own layers (human.svg), drawn smaller by
     actor-paint's adultArt; url(#material-2) is the hair and url(#material-3) the skin, painted by role. Per profession:
     staff-<p>-back (behind the head), staff-<p> (body with the left arm), staff-<p>-hair and staff-<p>-hat (head coordinates),
     staff-<p>-arm (the right arm resting) and staff-<p>-act (the right arm at work, with the tool). Every arm starts inside the
     torso, so the sleeve overlaps the shirt at the shoulder. -->

