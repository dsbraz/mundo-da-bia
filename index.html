<!doctype html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7b38e"><meta name="description" content="Uma casinha de faz de conta: amigos, gatinhos e mil histórias para inventar."><title>Mundo da Bia</title></head>
<body>
<main id="app">
  <div id="world" tabindex="0" role="group" aria-label="Área de brincar. Arraste os personagens. Use as setas para mover o personagem selecionado."></div>
  <header><h1>Mundo da <strong>Bia<span>✿</span></strong></h1><span id="save-status" role="status"></span></header>
  <details class="tray home-tray"><summary aria-label="Explorar a casa">⌂</summary><section class="panel"><h2>Nossa casa</h2><nav id="rooms" aria-label="Cômodos"></nav><button id="gather" type="button">♡ Reunir todo mundo</button><p>Arraste a turma para o sofá. Toque nos móveis para descobrir!</p></section></details>
  <button id="sound-toggle" class="corner" type="button" aria-label="Ativar sons" aria-pressed="false">♫</button>
  <details class="tray cast-tray"><summary aria-label="Escolher personagem"><img src="/icons/bia.svg" alt=""><span>Turminha</span></summary><section class="panel" aria-label="Personagens"><h2>Quem vai brincar?</h2><div id="cast"></div></section></details>
  <details class="tray tools-tray"><summary aria-label="Roupas e brincadeiras">♧<span>Brincar</span></summary><section class="panel play-tools" aria-label="Brincadeiras"><h2 id="selected"></h2><p id="actor-status"></p><div id="actions" class="actions"></div><h3>Meu guarda-roupa</h3><button id="wardrobe-toggle" type="button" aria-expanded="false">Abrir armário</button><div id="looks" class="choices"></div><h3>Coisinhas para brincar</h3><div id="objects" class="choices"></div><h3>A casa também brinca</h3><div id="furniture" class="choices"></div></section></details>
  <div id="announcement" class="announcement" role="status" aria-live="polite"></div>
</main>
<script type="module" src="/src/bootstrap/main.ts"></script>
</body></html>
